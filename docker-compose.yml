# Всё приложение:        docker compose up -d --build   → http://127.0.0.1:8000
# Только база (разработка): docker compose up -d db       → 127.0.0.1:5432, сервер — uv run transcriber-web
#
# При первом запуске сервис models скачивает модель распознавания (~1,5 ГБ) в ./models,
# потом стартует app. Данные: база — том pgdata, записи — ./recordings, ключ шифрования
# (если SECRET_KEY не задан) — ./instance. Подробности — README, «Запуск в Docker».

x-app: &app
  image: transcriber:latest   # собирает сервис app (build), models использует тот же образ
  env_file:
    - path: .env
      required: false          # без .env тоже стартует (summary — только Ollama)
  volumes:
    - ${MODELS_DIR:-./models}:/app/models
    - ${RECORDINGS_DIR:-./recordings}:/app/recordings
    - ${INSTANCE_DIR:-./instance}:/app/instance

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcriber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcriber}
      POSTGRES_DB: ${POSTGRES_DB:-transcriber}
    ports:
      - "127.0.0.1:5432:5432"   # только локально
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовый: скачивает модель, если её нет (проверка по model.bin; качает во временную
  # папку и переименовывает — прерванная загрузка не оставит битую модель и продолжится).
  # Стартует от root только чтобы отдать папки, созданные Docker (на Linux — root), UID
  # сервера, и сразу переходит на него.
  models:
    <<: *app
    pull_policy: never          # образ локальный, его собирает app
    user: "0:0"
    command: ["download-model", "--owner", "${APP_UID:-1000}:${APP_GID:-1000}",
              "--prepare", "/app/recordings", "/app/instance"]
    restart: "no"

  app:
    <<: *app
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"   # на Linux — владелец ./recordings (id -u / id -g)
    init: true                                  # SIGTERM → сервер, зомби ffmpeg не копятся
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      models:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-transcriber}:${POSTGRES_PASSWORD:-transcriber}@db:5432/${POSTGRES_DB:-transcriber}
      # Ollama на хосте; адрес, сохранённый в админке, важнее этого значения
      OLLAMA_HOST: ${DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}
      HF_HUB_OFFLINE: "1"      # модель уже скачана сервисом models, в сеть за ней не ходить
      # DeepSeek через прокси хоста (VPN): прокси должен слушать не только 127.0.0.1
      # HTTPS_PROXY: http://host.docker.internal:1082
      # NO_PROXY: localhost,127.0.0.1,db,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"     # на Linux; в Docker Desktop/OrbStack и так есть
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"      # только локально
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY:-4g}   # модель ~2 ГБ в памяти + обработка

volumes:
  pgdata:
