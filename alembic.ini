# Миграции базы веб-интерфейса. Сервер применяет их сам при запуске;
# новая миграция после изменения transcriber/server/db.py:
#   uv run alembic revision --autogenerate -m "описание"
[alembic]
script_location = transcriber/server/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
