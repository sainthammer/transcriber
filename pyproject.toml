[project]
name = "vosk-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "regex>=2026.9.10",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "vosk==0.3.44",
]

[project.scripts]
transcribe = "transcriber.cli:main"
summarize = "transcriber.summary:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives in ./transcriber, not ./src/transcriber
module-name = "transcriber"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
