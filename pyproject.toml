[project]
name = "transcriber"
version = "0.1.0"
description = "Транскрибация аудио (faster-whisper) и структурированное summary (DeepSeek или Ollama)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
transcribe = "transcriber.cli:main"
summarize = "transcriber.summary:main"
transcriber-web = "transcriber.server:main"
transcriber-admin = "transcriber.server.manage:main"
download-model = "transcriber.models:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives in ./transcriber, not ./src/transcriber
module-name = "transcriber"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Alembic's own script.py.mako template writes unsorted imports and a trailing space
# after "Revises: " on every autogenerated revision — nothing here to lint.
extend-exclude = ["transcriber/server/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # Many comments, docstrings and Russian-language strings (prompts, error messages)
    # run well past 100 columns by design — wrapping them buys nothing.
    "E501",
    # FastAPI's own pattern: Depends()/Body()/File() as argument defaults, evaluated once
    # per request by the framework, not at import time.
    "B008",
    # Imports are hand-wrapped several names per continuation line, and test helpers
    # (test_*.py imported by other tests) are grouped apart from the transcriber package
    # on purpose — isort would reflow both throughout the codebase for no behavior change.
    "I001",
]
