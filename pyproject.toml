[project]
name = "transcriber"
version = "0.1.0"
description = "Транскрибация аудио (faster-whisper) и структурированное summary (DeepSeek или Ollama)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
transcribe = "transcriber.cli:main"
summarize = "transcriber.summary:main"
transcriber-web = "transcriber.server:main"
transcriber-admin = "transcriber.server.manage:main"
download-model = "transcriber.models:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives in ./transcriber, not ./src/transcriber
module-name = "transcriber"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
